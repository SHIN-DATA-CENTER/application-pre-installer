name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Package EXE and dependency notices
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: application-pre-installer-windows-x64
          path: dist/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: application-pre-installer-windows-x64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/application-pre-installer.exe
            dist/application-pre-installer-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/THIRD_PARTY_NOTICES.md
            dist/dependency-licenses.json
